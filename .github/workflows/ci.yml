name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes older runs of the same ref: cancel the in-progress run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache toolchain and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
          restore-keys: toolchains-${{ runner.os }}-

      - name: Prepare pinned toolchain
        run: |
          elan toolchain install "$(tr -d '[:space:]' <lean-toolchain)"
          lake --version

      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      - name: Build Lean library
        run: lake build

      - name: Core specs
        run: |
          lake build +ProofForgeCoreTests.CoreCodecSpec
          lake build +ProofForgeCoreTests.CoreCollectionsSpec
          lake build +ProofForgeCoreTests.CoreMathSpec

      # Save only from master so PR runs do not evict the build cache.
      - name: Save Lean build products
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}

  tag-consistency:
    # The target repositories pin v0.1.0; the tag must always point at the
    # pushed master head so a bump of the pin cannot drift behind master.
    name: Tag matches master
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag == master head
        run: |
          tag_sha="$(git rev-parse HEAD)"
          git fetch origin master
          master_sha="$(git rev-parse origin/master)"
          if [ "$tag_sha" != "$master_sha" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($tag_sha) is not master head ($master_sha)"
            exit 1
          fi
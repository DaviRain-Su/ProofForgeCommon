name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes older runs of the same ref: cancel the in-progress run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache toolchain and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
          restore-keys: toolchains-${{ runner.os }}-

      - name: Prepare pinned toolchain
        run: |
          elan toolchain install "$(tr -d '[:space:]' <lean-toolchain)"
          lake --version

      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      - name: Build Lean library
        run: lake build

      # Plain `lake build` covers only @[default_target] (ProofForgeCore);
      # build the whole spec lib so every current and future spec module runs
      # (enumerating modules here let QuintSpec slip through once).
      - name: Core specs
        run: lake build ProofForgeCoreTests

      # Save only from main so PR runs do not evict the build cache.
      - name: Save Lean build products
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}

  quint:
    # Exercises the Quint default target end to end: build the emitter exe,
    # compile the shared fixtures to .qnt modules, then parse and typecheck
    # them with the real Quint CLI (pinned, matching the emitter's syntax
    # baseline). `quint run` is intentionally not gated: the evaluator rejects
    # PF_MAX_U64 (outside i64), a limitation the source-only target documents.
    name: Quint CLI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache toolchain and Lean dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: toolchains-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
          restore-keys: toolchains-${{ runner.os }}-

      - name: Prepare pinned toolchain
        run: |
          elan toolchain install "$(tr -d '[:space:]' <lean-toolchain)"
          lake --version

      # Restore-only: the Lean job owns saving so this job never evicts.
      - name: Restore Lean build products
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ github.sha }}
          restore-keys: lake-build-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

      - name: Build emitter
        run: lake build quintEmit

      - name: Emit fixture .qnt modules
        run: ./.lake/build/bin/quintEmit build/quint

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Quint parse + typecheck
        run: |
          set -euo pipefail
          for f in build/quint/*.qnt; do
            echo "== $f"
            npx -y @informalsystems/quint@0.32.0 parse "$f"
            npx -y @informalsystems/quint@0.32.0 typecheck "$f"
          done

  tag-consistency:
    # Release tags are milestones on main; consumers that need a reproducible
    # build may pin one, but a tag lagging behind main would advertise stale
    # content as newer.
    name: Tag matches main
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify tag == main head
        run: |
          tag_sha="$(git rev-parse HEAD)"
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($tag_sha) is not main head ($main_sha)"
            exit 1
          fi